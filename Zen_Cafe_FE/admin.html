<!doctype html>
<html lang="en" class="zen-last-shuriken-site">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('zen-cafe-theme');
          const theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="theme-color" content="#f5ece4" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" /><link rel="icon" href="/favicon.ico" sizes="48x48" /><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<title>Zen Café — Admin Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
